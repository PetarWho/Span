# Builds Span for Windows, macOS, Linux and Android on every push to main and
# publishes them as a new release: v<VERSION file>.<run number>, e.g. v1.0.7.
# To start a new minor/major series, edit the VERSION file.
name: Build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(tr -d ' \r\n' < VERSION).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Span.exe
          - os: macos-latest # Apple Silicon
            asset: Span-macOS.zip
          - os: ubuntu-22.04 # older glibc, so the binary runs on more distributions
            asset: Span-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller cryptography PySide6

      - name: Stamp version
        shell: bash
        run: |
          python - <<'EOF'
          import os, re, pathlib
          p = pathlib.Path("span.py")
          p.write_text(re.sub(r'^VERSION = ".*?"', f'VERSION = "{os.environ["VERSION"]}"', p.read_text(), count=1, flags=re.M))
          EOF
          grep '^VERSION' span.py

      - name: Build
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) args=(--onefile --icon assets/icon.ico --add-data "assets;assets") ;;
            macOS)   args=(--onedir --icon assets/icon.icns --add-data "assets:assets" --osx-bundle-identifier com.petarwho.span) ;;
            Linux)   args=(--onefile --add-data "assets:assets") ;;
          esac
          pyinstaller --noconfirm --windowed --name Span --hidden-import span_qt "${args[@]}" span.py

      - name: Self-test the packaged app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process dist\Span.exe -ArgumentList "selftest","--out","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Self-test the packaged app (macOS / Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = macOS ]; then app=dist/Span.app/Contents/MacOS/Span; else app=dist/Span; fi
          "$app" selftest

      - name: Package
        shell: bash
        run: |
          mkdir out
          case "$RUNNER_OS" in
            Windows) cp dist/Span.exe out/Span.exe ;;
            macOS)   ditto -c -k --keepParent dist/Span.app out/Span-macOS.zip ;;
            Linux)
              mkdir span
              cp dist/Span span/span
              cp assets/icon.png span/span.png
              printf '[Desktop Entry]\nType=Application\nName=Span\nExec=%s\nIcon=%s\nCategories=Network;FileTransfer;\n' \
                '/path/to/span/span' '/path/to/span/span.png' > span/span.desktop
              tar czf out/Span-linux-x86_64.tar.gz span ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Protocol interop tests (Dart vs span.py)
        run: |
          python -m pip install cryptography
          flutter pub get
          flutter test test/interop_test.dart

      - name: Signing key
        working-directory: mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Signing secrets are missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PW" "$KEY_ALIAS" "$KEY_PW" > key.properties

      - name: Build APK
        run: |
          flutter build apk --release --build-name "$VERSION" --build-number "${{ github.run_number }}"
          mkdir -p ../out && cp build/app/outputs/flutter-apk/app-release.apk ../out/Span.apk

      - name: Check it's signed with the Span key
        run: |
          signer=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$signer" verify --print-certs ../out/Span.apk | tee certs.txt
          grep -q "CN=Span" certs.txt

      - name: Remove signing files
        if: always()
        working-directory: mobile/android
        run: rm -f release.jks key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: Span.apk
          path: out/Span.apk
          if-no-files-found: error

  release:
    needs: [version, desktop, android]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        run: |
          ls -la assets
          cat > notes.md <<'EOF'
          ## Downloads

          | | File | First run |
          |---|---|---|
          | Windows | `Span.exe` | Windows may show "Windows protected your PC": click **More info**, then **Run anyway**. |
          | macOS (Apple Silicon) | `Span-macOS.zip` | Unzip, then right-click **Span** and choose **Open**. On macOS 15+, use System Settings > Privacy & Security > **Open Anyway**. |
          | Linux (x86-64) | `Span-linux-x86_64.tar.gz` | `tar xzf Span-linux-x86_64.tar.gz && ./span/span`. Needs `libxcb-cursor0` on some distributions. |
          | Android | `Span.apk` | Open it on the phone and allow installing from that source. New versions install over old ones. |

          All versions talk to each other: same network, or anywhere through your own relay. See the [README](https://github.com/PetarWho/Span#readme).
          EOF
          gh release create "v$VERSION" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Span $VERSION" \
            --notes-file notes.md \
            --generate-notes
